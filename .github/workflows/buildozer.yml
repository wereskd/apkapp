name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 1. Фиксируем Python 3.11 (Kivy 2.3.x не работает с 3.14)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'
      
      # 2. Явно устанавливаем Java 17 (требуется для сборки Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            git zip unzip wget \
            patchelf \
            libpq-dev
      
      # 3. Фиксируем Cython < 3.0 (обязательно для Kivy)
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip "virtualenv==20.22.0"
          pip install buildozer "cython<3.0"

      # Критично: изолированные PEP517-окружения (сборка Kivy через Cython)
      # иначе тянут Cython 3.1+, который на Python 3.12+ падает с
      # ModuleNotFoundError: No module named 'cgi'. Ограничиваем версии pip
      # глобально — переменная подхватится всеми вложенными вызовами pip.
      - name: Pin versions inside isolated PEP517 build environments
        run: |
          cat > "$RUNNER_TEMP/pip-constraints.txt" <<'EOF'
          cython<3.1
          setuptools<80
          wheel<0.46
          EOF
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/pip-constraints.txt" >> "$GITHUB_ENV"
      
      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
      
      - name: Build APK
        run: |
          buildozer android debug
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          CI: true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-apk
          path: bin/*.apk
