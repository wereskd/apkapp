# .github/workflows/buildozer.yml
name: Build APK (Frontend Only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            openjdk-17-jdk-headless git zip unzip wget
      
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0"
      
      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
        env:
          ANDROID_SDK_ROOT: /opt/android/sdk
      
      - name: Build APK
        run: buildozer android debug
        env:
          ANDROID_SDK_ROOT: /opt/android/sdk
          CI: true
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-apk
          path: bin/*.apk
