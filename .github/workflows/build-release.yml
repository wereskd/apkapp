name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            git zip unzip wget \
            patchelf \
            libpq-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0" "virtualenv<20.23"

      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # Подписываем APK ключом из секретов репозитория (keystore, base64)
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "SECRETS_MISSING"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          grep -q '^android.release' buildozer.spec && \
            sed -i "s|^android.release.*|android.release = True|" buildozer.spec || \
            echo "android.release = True" >> buildozer.spec
          grep -q '^android.keystore.name' buildozer.spec && \
            sed -i "s|^android.keystore.name =.*|android.keystore.name = release.keystore|" buildozer.spec || \
            echo "android.keystore.name = release.keystore" >> buildozer.spec
          grep -q '^android.keystore.alias' buildozer.spec && \
            sed -i "s|^android.keystore.alias =.*|android.keystore.alias = ${KEY_ALIAS:-release}|" buildozer.spec || \
            echo "android.keystore.alias = ${KEY_ALIAS:-release}" >> buildozer.spec
          grep -q '^android.keystore.password' buildozer.spec && \
            sed -i "s|^android.keystore.password =.*|android.keystore.password = ${KEYSTORE_PASSWORD}|" buildozer.spec || \
            echo "android.keystore.password = ${KEYSTORE_PASSWORD}" >> buildozer.spec
        continue-on-error: true

      - name: Build APK (debug)
        run: buildozer android debug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          CI: true

      - name: Build release APK (if keystore provided)
        run: buildozer android release
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          CI: true
        continue-on-error: true

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp bin/*.apk out/ 2>/dev/null || true
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-apk-release
          path: out/*.apk

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
